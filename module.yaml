repositories:
  - id: mavenLocal
    url: mavenLocal
    resolve: false
    publish: true

product:
  type: jvm/lib

description: Certificate toolkit for Kotlin/JVM

settings:
  jvm:
    release: 21
    storeParameterNames: true

    jdk:
      version: 25
      distributions: [ zulu, temurin ]

    test:
      junitPlatformVersion: 6.1.2
      freeJvmArgs:
        - --enable-native-access=ALL-UNNAMED
        - -Djunit.platform.reporting.open.xml.enabled=true

  kotlin:
    version: 2.4.0
    languageVersion: 2.4
    apiVersion: 2.4
    progressiveMode: true
    allWarningsAsErrors: true
    suppressWarnings: false
    verbose: false
    freeCompilerArgs:
      - -Xexplicit-api=strict
      - -Wextra
      - -Xcollection-literals
      - -Xreport-all-warnings
      - -Xreturn-value-checker=full
      - -Xcontext-sensitive-resolution
      - -Xconsistent-data-class-copy-visibility
      - -Xname-based-destructuring=complete
      - -Xwhen-expressions=indy
    optIns:
      - kotlin.ExperimentalStdlibApi
      - kotlin.ExperimentalUnsignedTypes
      - kotlin.contracts.ExperimentalContracts
      - kotlin.io.encoding.ExperimentalEncodingApi
      - kotlin.time.ExperimentalTime
      - kotlin.uuid.ExperimentalUuidApi
      - kotlin.concurrent.atomics.ExperimentalAtomicApi

  publishing:
    enabled: true
    group: dev.suresh.certkit
    version: 0.4.0
    signArtifacts: true
    publishSources: true
    mavenCentral:
      enabled: true
      publishingMode: auto
    pom:
      url: https://github.com/sureshg/certkit
      scm: https://github.com/sureshg/certkit.git
      developers:
        - name: Suresh
          url: https://suresh.dev
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt

test-settings:
  kotlin:
    freeCompilerArgs:
      - -Xexplicit-api=disable
    powerAssert:
      enabled: true
      functions:
        - kotlin.assert
        - kotlin.require
        - kotlin.test.assertTrue
        - kotlin.test.assertEquals
        - kotlin.test.assertNull
        - kotlin.test.assertContentEquals

dependencies:
  - $libs.kotlinx.datetime
  - $libs.kotlinx.io.core